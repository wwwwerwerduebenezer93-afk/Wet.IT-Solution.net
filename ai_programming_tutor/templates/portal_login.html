{% extends 'base.html' %}{% block title %}{{portal}} · CodeMentor AI{% endblock %}{% block content %}<section class="auth portal-auth"><form method="post" class="panel"><img class="portal-qr" src="{{url_for('static',filename='qr/'+role.replace('lecturer','teacher')+'-login.png')}}" alt="QR code for {{portal}}"><span class="eyebrow">{{portal|upper}}</span><h1>{{portal}} login</h1><p>Sign in using an authorized {{'teacher' if role=='lecturer' else role}} account.</p><label>Email<input name="email" type="email" required autofocus></label><label>Password<input name="password" type="password" required></label><button class="button" type="submit">Open {{portal}}</button><p><a href="{{url_for('system_links')}}">View all portal links and QR codes</a></p></form></section>{% endblock %}
